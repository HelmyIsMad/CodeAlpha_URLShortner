<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="logo">
        <h1>Shorten your link</h1>
        <p class="subtitle">Paste a long URL and get a short link in seconds.</p>
      </div>

      <div class="form-group">
        <label for="longUrl">Enter URL</label>
        <input type="url" id="longUrl" placeholder="https://example.com/very/long/url" autofocus>
      </div>

      <button class="btn btn-primary" id="shortenBtn" onclick="shorten()">
        <span class="btn-text">Shorten</span>
        <span class="spinner"></span>
      </button>

      <div class="result-box" id="resultBox">
        <div class="result-label">Your shortened link</div>
        <div class="result-content">
          <a href="" id="shortLink" target="_blank"></a>
          <button class="copy-btn" id="copyBtn" onclick="copyLink()" title="Copy to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <p class="back-link"><a href="/admin">Admin panel</a></p>
    </div>
  </div>

  <script>
    const btn = document.getElementById('shortenBtn');
    const input = document.getElementById('longUrl');
    const resultBox = document.getElementById('resultBox');
    const shortLink = document.getElementById('shortLink');
    const copyBtn = document.getElementById('copyBtn');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') shorten();
    });

    async function shorten() {
      const longUrl = input.value.trim();
      if (!longUrl) {
        showError('Please enter a URL');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;
      resultBox.classList.remove('visible', 'success', 'error');

      try {
        const res = await fetch('/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ longUrl })
        });
        const data = await res.json();

        if (data.shortUrl) {
          shortLink.href = data.shortUrl;
          shortLink.textContent = data.shortUrl;
          resultBox.className = 'result-box success visible';
          copyBtn.className = 'copy-btn';
        } else {
          showError(data.error || 'Something went wrong');
        }
      } catch (err) {
        showError('Network error. Please try again.');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    function showError(msg) {
      resultBox.className = 'result-box error visible';
      shortLink.textContent = msg;
      shortLink.href = '';
    }

    async function copyLink() {
      const text = shortLink.textContent;
      if (!text || !shortLink.href) return;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.classList.add('copied');
        setTimeout(() => copyBtn.classList.remove('copied'), 2000);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.classList.add('copied');
        setTimeout(() => copyBtn.classList.remove('copied'), 2000);
      }
    }
  </script>
</body>
</html>
